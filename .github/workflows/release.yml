# Dựng installer và **công khai** bản phát hành khi đẩy tag `v*`. Không cần bấm gì bằng tay.
#
# ## Hệ quả: đẩy tag là hành động không lùi lại được
#
# Trước đây bản phát hành ra ở dạng nháp, và cái nút Publish chính là lần rà cuối của con
# người. Giờ không còn nữa — tag đi là bản phát hành lên, nên **thứ tự đẩy trở thành cổng
# kiểm tra duy nhất**:
#
#   git push origin main        # đợi CI xanh
#   git push origin v0.1.3     # rồi mới đẩy tag
#
# Đẩy cả hai cùng lúc (`git push origin main v0.1.3`) thì `ci.yml` và workflow này chạy
# song song, mà workflow này lâu hơn không đáng kể — nên hoàn toàn có thể có một bản phát
# hành công khai từ một commit mà test vừa báo đỏ. Tách hai lệnh không tốn thêm giây CI
# nào; nó chỉ đòi sự kiên nhẫn.
#
# Hai phép kiểm rẻ nhất thì đặt ngay trong workflow này (endpoint khớp repo, tag khớp
# version) vì cả hai đều thất bại trong im lặng và không test nào bắt được.
#
# ## Bí mật cần đặt trước
#
# | Secret | Bắt buộc | Việc |
# |---|---|---|
# | `TAURI_SIGNING_PRIVATE_KEY` | ✅ | Nội dung `.keys/writa-update.key`. Không có nó thì tính năng tự cập nhật không hoạt động — app sẽ từ chối gói không ký. |
# | `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` | ✅ | Mật khẩu của khoá trên. |
# | `WINDOWS_CERT_PFX_BASE64` | ⬜ | Chứng chỉ ký mã dạng `.pfx`, mã hoá base64. Thiếu thì bản phát hành **không ký** — vẫn chạy được, chỉ hiện "Unknown publisher". |
# | `WINDOWS_CERT_PASSWORD` | ⬜ | Mật khẩu của `.pfx`. |
#
# Xuất `.pfx` từ máy đang có chứng chỉ:
#
#   .\scripts\sign.ps1 -ExportPfx
#
# ## Vì sao chữ ký mã là tuỳ chọn còn chữ ký cập nhật thì không
#
# Chữ ký mã hiện tại là **tự ký**, nên nó không làm SmartScreen im lặng — thiếu nó chỉ
# đổi dòng chữ trong hộp thoại cảnh báo. Chữ ký gói cập nhật thì khác hẳn: nó là thứ
# duy nhất ngăn một máy chủ bị chiếm quyền đẩy mã tuỳ ý vào máy user, và Writa từ chối
# mọi gói không khớp khoá công khai nhúng sẵn.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag để dựng, ví dụ v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # Chạy bằng `workflow_dispatch` thì tag đến từ input, chạy bằng push tag thì đến từ
      # ref. Gộp vào một chỗ để hai đường không lệch nhau — trước đây input `version`
      # được khai báo nhưng không ai đọc, nên `workflow_dispatch` dựng ra một bản phát
      # hành mang tên nhánh.
      TAG: ${{ inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      # Hai thứ này phải đúng *trước khi* dựng, vì cả hai đều là hằng số lúc dựng và cả
      # hai đều thất bại trong im lặng.
      #
      # Endpoint nằm trong file thực thi của user, nên endpoint sai là **không bản cập
      # nhật nào sửa được** — ai đã cài thì mắc lại vĩnh viễn, phải tự đi tải bản mới.
      # Đây không phải giả thuyết: v0.1.0 và v0.1.1 đầu tiên đã ra đời với endpoint trỏ
      # một repo không tồn tại, và triệu chứng duy nhất là một dòng "Could not fetch a
      # valid release JSON" trong Cài đặt.
      #
      # Version lệch tag thì `latest.json` trỏ vào một tên file không tồn tại, và updater
      # cũng chỉ báo đúng dòng đó.
      - name: Kiểm endpoint và version trước khi dựng
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json

          $ep = $conf.plugins.updater.endpoints[0]
          $want = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
          if ($ep -ne $want) {
            Write-Output "::error::Endpoint cap nhat khong khop repo dang dung."
            Write-Output "::error::  tauri.conf.json: $ep"
            Write-Output "::error::  phai la:         $want"
            exit 1
          }
          Write-Output "endpoint OK  $ep"

          if ($env:TAG -ne "v$($conf.version)") {
            Write-Output "::error::Tag $env:TAG khong khop version $($conf.version) trong tauri.conf.json."
            Write-Output "::error::latest.json se tro vao mot ten file khong ton tai."
            Write-Output "::error::Chay: .\scripts\bump-version.ps1 $($env:TAG.TrimStart('v'))"
            exit 1
          }
          Write-Output "version OK   $env:TAG"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          key: lexicon-${{ hashFiles('data/lexicon/*.tsv') }}

      - run: npm ci

      # Chứng chỉ được nạp vào kho của *user đang chạy runner*, không phải kho máy —
      # runner là máy dùng một lần, và kho user không cần quyền quản trị.
      - name: Nạp chứng chỉ ký mã (nếu có)
        id: cert
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX) {
            Write-Output "Khong co WINDOWS_CERT_PFX_BASE64 - se dung ban KHONG KY."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP "writa.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          $pw = ConvertTo-SecureString -String $env:PFX_PASSWORD -AsPlainText -Force
          $c = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $path -Force
          Write-Output "Da nap chung chi: $($c.Thumbprint)"
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Dựng và phát hành
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Writa ${{ env.TAG }}"
          # Vẫn dựng ra dạng **nháp**, nhưng không phải để chờ người bấm — bước
          # "Công khai bản phát hành" ở dưới sẽ tự bỏ cờ nháp.
          #
          # Vì sao phải qua trạng thái nháp thay vì đặt thẳng `releaseDraft: false`: cần
          # bảo đảm bản phát hành chỉ trở thành "latest" **sau khi** asset đã lên đủ. Đặt
          # `false` là giao điều đó cho thứ tự nội bộ của `tauri-action` — nếu nó tạo bản
          # phát hành trước rồi mới upload thì có một khoảng thời gian
          # `releases/latest/download/latest.json` chưa tồn tại, và app của user tình cờ
          # kiểm tra trong khoảng đó nhận đúng lỗi "Could not fetch a valid release JSON".
          #
          # Đi qua nháp rồi tự công khai ở bước cuối thì thứ tự đó do ta quyết định, không
          # phải đoán. Nháp không tính là "latest", nên khoảng thời gian đó vô hình.
          releaseDraft: true
          prerelease: false
          # `latest.json` là thứ tính năng tự cập nhật đọc. `tauri-action` sinh và tải nó
          # lên cùng bản phát hành, khớp với endpoint trong `tauri.conf.json`.
          includeUpdaterJson: true
          args: ${{ steps.cert.outputs.signed == 'true' && '--config src-tauri/tauri.signed.conf.json' || '' }}
          releaseBody: |
            ## Cài đặt

            Tải `Writa_*_x64-setup.exe` bên dưới rồi chạy.

            **Windows sẽ hiện cảnh báo "Windows protected your PC".** Đó là vì Writa
            chưa có uy tín tải về, không phải vì mã có vấn đề. Bấm **More info → Run
            anyway**. Chi tiết vì sao, và vì sao tiền không mua được điều đó, xem
            [SPIKE_RESULTS.md](../blob/main/SPIKE_RESULTS.md) mục Spike 6.

            ## Sau khi cài

            Writa nằm ở **khay hệ thống**, không mở cửa sổ nào.

            | Phím tắt | Việc |
            |---|---|
            | `Ctrl+Alt+V` | Kiểm tra chính tả đoạn đang bôi đen |
            | `Ctrl+Alt+D` | Thêm dấu cho đoạn đang bôi đen |
            | `Tab` | Áp dụng gợi ý inline (khi bật kiểm tra lúc gõ) |

            Kiểm tra ngay lúc gõ mặc định **tắt** — bật trong Cài đặt. Nó cắm hook bàn
            phím toàn máy, nên đó là thứ bạn phải chủ động đồng ý.

      # Bỏ cờ nháp, đúng một lần, sau khi bước trên đã upload đủ installer, `.sig` và
      # `latest.json`. Đây là thời điểm duy nhất an toàn để bản phát hành trở thành
      # "latest": trước đó thì updater thấy một "latest" rỗng, sau đó thì không ai thấy gì.
      #
      # `--latest` là cần thiết chứ không dư: GitHub chọn "latest" theo ngày phát hành,
      # nên nếu một bản cũ được công khai sau thì nó chiếm chỗ. Nói thẳng ra vẫn chắc hơn.
      #
      # Bước này chạy bằng `gh`, có sẵn trên runner của GitHub. Nó chỉ đổi một cờ, nên
      # nếu nó thất bại thì mọi asset vẫn còn nguyên, chỉ cần bấm Publish bằng tay.
      - name: Công khai bản phát hành
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$env:TAG" --draft=false --latest
